name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            sdk: iphonesimulator
            platform: iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download ${{ matrix.platform }} platform
        run: xcodebuild -downloadPlatform ${{ matrix.platform }}

      - name: Set up Go for embedded Tailscale
        uses: actions/setup-go@v6
        with:
          go-version-file: TailscaleBridge/go.mod
          cache-dependency-path: TailscaleBridge/go.sum

      - name: Test and build embedded Tailscale
        shell: bash
        run: |
          (cd TailscaleBridge && go test -race -count=1 ./... && go vet ./...)
          arch=$(uname -m)
          echo "XCODE_ARCH=$arch" >> "$GITHUB_ENV"
          if [[ "$arch" == x86_64 ]]; then arch=amd64; fi
          bash TailscaleBridge/build-apple.sh iphonesimulator "$arch"

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug -sdk ${{ matrix.sdk }} -destination 'generic/platform=iOS Simulator' ARCHS="$XCODE_ARCH" ONLY_ACTIVE_ARCH=YES clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release -sdk ${{ matrix.sdk }} -destination 'generic/platform=iOS Simulator' ARCHS="$XCODE_ARCH" ONLY_ACTIVE_ARCH=YES clean build
